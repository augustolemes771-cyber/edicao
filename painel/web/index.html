<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Painel de Edição · Mateus Dias</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23030405'/%3E%3Cpath d='M12 9l11 7-11 7z' fill='%2312d4cd'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body class="ver-conversa">

<header id="topo">
	<div class="marca">
		<span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></svg></span>
		<div><b>Painel de Edição</b><small>Mateus Dias</small></div>
	</div>

	<div class="seletores">
		<label class="campo-topo" title="Tema: tudo que for feito nele vira aprendizado para os próximos vídeos do mesmo tema">
			<span>Tema</span>
			<select id="tema"></select>
		</label>
		<button class="btn icone" id="novoTema" title="Criar um tema novo" aria-label="Criar um tema novo" data-ic="plus"></button>
		<label class="campo-topo largo" title="Vídeo (projeto) que você está editando">
			<span>Vídeo</span>
			<select id="projeto"></select>
		</label>
		<button class="btn primario" id="novoProj" data-ic="plus">Novo vídeo</button>
	</div>

	<div class="status" id="status">
		<button class="pilula" id="stClaude" title="Claude Code neste computador"><i class="ponto"></i><span>Claude</span></button>
		<button class="pilula" id="stPod" title="Pod (computador na nuvem para renderizar)"><i class="ponto"></i><span>Pod</span></button>
		<button class="pilula" id="stTarefas" title="Tarefas rodando"><i class="ponto"></i><span>Sem tarefas</span><em class="mini-barra" hidden><i></i></em></button>
	</div>

	<div class="acoes-topo">
		<button class="btn" id="studio" data-ic="monitor" title="Abrir o Remotion Studio (editor visual) com a placa de vídeo">Studio</button>
		<button class="btn" id="salvar" data-ic="cloud-up" title="Envia para o GitHub templates, peças e edições novas">Salvar na nuvem</button>
		<button class="btn icone" id="atualizar" data-ic="refresh" title="Atualizar e reabrir: baixa a versão mais recente do GitHub e reabre o painel" aria-label="Atualizar e reabrir"></button>
		<button class="btn icone" id="abrirPrefs" data-ic="gear" title="Preferências" aria-label="Preferências"></button>
	</div>
</header>

<main id="app">
	<aside id="bib" class="coluna">
		<div class="coluna-topo">
			<h2>Biblioteca</h2>
			<div class="busca">
				<span data-ic="search"></span>
				<input id="busca" type="search" placeholder="Buscar peças, sons, fontes, pack..." autocomplete="off">
			</div>
		</div>
		<div id="bibLista" class="rolavel"><div class="carregando">Carregando a biblioteca...</div></div>
	</aside>

	<section id="centro" class="coluna">
		<div id="claude" class="faixa" hidden></div>
		<div class="conversa-topo">
			<div>
				<h2 id="convTitulo">Conversa</h2>
				<small id="convSub">Escolha um vídeo e diga o que editar.</small>
			</div>
			<button class="btn fantasma" id="zerar" data-ic="chat-plus" title="Começar conversa nova neste vídeo">Conversa nova</button>
		</div>
		<div id="msgs" class="rolavel" aria-live="polite"></div>
		<div class="compositor">
			<div class="atalhos">
				<div id="chips" class="chips"></div>
				<button class="btn fantasma mini" id="gerAtalhos" data-ic="edit" title="Adicionar ou remover atalhos de pedido">Atalhos</button>
			</div>
			<form id="f">
				<textarea id="pedido" rows="3" placeholder="Ex.: usa o template do depoimento e coloca a moeda 3D girando quando eu falar 'investimento'"></textarea>
				<div class="form-acoes">
					<small class="dica"><kbd>Enter</kbd> envia · <kbd>Shift</kbd>+<kbd>Enter</kbd> nova linha</small>
					<button type="button" class="btn perigo" id="parar" data-ic="stop" hidden>Parar</button>
					<button class="btn primario" id="enviar" data-ic="send">Enviar</button>
				</div>
			</form>
		</div>
	</section>

	<aside id="lado" class="coluna">
		<nav class="abas" role="tablist">
			<button role="tab" data-aba="render" class="on" data-ic="play">Render</button>
			<button role="tab" data-aba="fluxo" data-ic="list">Fluxo</button>
			<button role="tab" data-aba="midias" data-ic="film">Mídias</button>
			<button role="tab" data-aba="refs" data-ic="star">Referências</button>
		</nav>
		<div class="rolavel painel-aba" id="aba-render"></div>
		<div class="rolavel painel-aba" id="aba-fluxo" hidden></div>
		<div class="rolavel painel-aba" id="aba-midias" hidden></div>
		<div class="rolavel painel-aba" id="aba-refs" hidden></div>
	</aside>
</main>

<nav id="navCel" aria-label="Seções">
	<button data-ver="biblioteca" data-ic="book">Biblioteca</button>
	<button data-ver="conversa" class="on" data-ic="chat">Conversa</button>
	<button data-ver="lado" data-ic="sliders">Vídeo</button>
</nav>

<!-- Tela do tema -->
<div id="tv" class="sobreposicao" hidden><div class="tela" id="tvc"></div></div>

<!-- Janela genérica (ver conteúdo, formulários, confirmações) -->
<div id="modal" class="sobreposicao" hidden>
	<div class="janela" role="dialog" aria-modal="true" aria-labelledby="mtitulo">
		<div class="janela-topo"><h3 id="mtitulo"></h3><button class="btn icone fantasma" id="mfechar" data-ic="x" aria-label="Fechar"></button></div>
		<div class="janela-corpo" id="mcorpo"></div>
		<div class="janela-rodape" id="mrodape" hidden></div>
	</div>
</div>

<div id="toasts" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
